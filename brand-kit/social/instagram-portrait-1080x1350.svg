<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><title>Instagram portrait / original brand manifesto</title><rect x="0" y="0" width="1080" height="1350" fill="#FF5C28"/><g fill="#101214" transform="translate(92,109.43) scale(0.41)"><path d="M8 76 29 24h19L27 76Z M41 76 70 4h19L60 76Z M74 76 95 24h19L93 76Z"/></g><text x="149.4" y="141" fill="#101214" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="41" letter-spacing="-0.8">ORVECT</text><text x="86" y="385" fill="#101214" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="105" letter-spacing="-4">La confiance</text><text x="86" y="501" fill="#101214" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="105" letter-spacing="-4">se construit.</text><text x="86" y="676" fill="#101214" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="105" letter-spacing="-4">Elle ne se</text><text x="86" y="792" fill="#101214" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="105" letter-spacing="-4">devine pas.</text><path d="M92 1073H988" stroke="#101214" stroke-width="1"/><text x="92" y="1130" fill="#101214" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" letter-spacing="0">UNE CONVICTION ORVECT</text><text x="92" y="1190" fill="#101214" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="34" letter-spacing="0">Au-delà du code défaut.</text></svg>